version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_accounts
    columns:
      - name: account_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

  - name: stg_transactions
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null

      - name: account_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id

      - name: transaction_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['DEPOSIT', 'PURCHASE', 'WITHDRAWAL']